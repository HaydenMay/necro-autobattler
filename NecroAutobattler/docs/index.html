<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Necromancer Merge Autobattler - prototype</title>
<style>
  :root { --bg:#120e1a; --panel:rgba(20,14,30,.86); --edge:#5b3a86; --gold:#e6b94a; --purple:#a45bff; --red:#e0524a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family:system-ui,Segoe UI,Roboto,sans-serif; color:#f1e9ff; -webkit-user-select:none; user-select:none; touch-action:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; touch-action:none; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:6px 10px; box-shadow:0 0 14px rgba(120,60,200,.35); }
  #top { top:6px; left:50%; transform:translateX(-50%); display:flex; gap:14px; align-items:center; font-weight:700; font-size:15px; white-space:nowrap; }
  #hearts { font-size:17px; letter-spacing:2px; }
  #domwrap { display:flex; align-items:center; gap:6px; } #dombar { width:78px; height:8px; background:#2a1b40; border-radius:5px; overflow:hidden; } #domfill { height:100%; background:linear-gradient(90deg,#8a3cff,#d99bff); width:0; }
  #enemy { top:6px; left:6px; font-size:12px; min-width:132px; border-color:#7d3a3a; box-shadow:0 0 14px rgba(200,60,60,.3); }
  .erow { display:flex; gap:6px; align-items:center; margin-top:3px; } .erow .x { color:#ffb0a8; } .erow .st { color:var(--gold); margin-left:auto; } .hint { opacity:.6; font-size:10.5px; margin-top:4px; }
  #gear { top:6px; right:6px; padding:5px 9px; cursor:pointer; font-size:16px; }
  #hand { bottom:6px; left:50%; transform:translateX(-50%); display:flex; gap:8px; max-width:62vw; overflow-x:auto; padding:6px 8px; }
  .card { position:relative; width:74px; min-width:74px; padding:16px 4px 5px; text-align:center; background:linear-gradient(#2b1c44,#1a1029); border:2px solid #6b46a3; border-radius:10px; cursor:pointer; }
  .card.sel { border-color:var(--gold); box-shadow:0 0 12px var(--gold); transform:translateY(-6px); } .card.dis { opacity:.5; } .card.swap { border-color:#39c6a3; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 12px #39c6a3; } }
  .card .cost { position:absolute; top:-8px; left:-8px; width:26px; height:26px; border-radius:50%; background:#8b3cff; border:2px solid #d5b3ff; font-weight:800; font-size:14px; line-height:22px; }
  .card .ic { font-size:28px; line-height:34px; } .card .nm { font-size:11px; font-weight:700; margin-top:2px; } .card .cs { color:var(--gold); font-size:11px; }
  .card.big { width:150px; min-width:150px; padding:22px 8px 10px; } .card.big .ic { font-size:40px; line-height:48px; } .card.big .nm { font-size:14px; } .card.big .role { font-size:11px; opacity:.85; margin-top:6px; }
  .empty { padding:18px; opacity:.6; font-size:13px; }
  #side { right:6px; bottom:6px; display:flex; flex-direction:column; gap:6px; align-items:stretch; width:150px; }
  button { background:#2b1c44; color:#f1e9ff; border:1px solid #7b55b8; border-radius:9px; padding:8px 10px; font-size:13px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; } button.on { background:#1d6b58; border-color:#39c6a3; }
  #btnBattle { font-size:19px; font-weight:800; letter-spacing:.06em; padding:12px; background:linear-gradient(#8a2fe0,#5a1aa0); border-color:#d5a8ff; box-shadow:0 0 16px rgba(160,80,255,.7); }
  #unitpanel { display:none; gap:6px; } #unitpanel button { flex:1; }
  #speed { top:46px; right:6px; display:none; gap:5px; } #speed button.on { background:#3d6ea8; }
  #info { bottom:112px; left:50%; transform:translateX(-50%); max-width:58vw; font-size:12px; text-align:center; padding:5px 10px; }
  body.inbattle #hand, body.inbattle #side, body.inbattle #info, body.inbattle #enemy { display:none; }
  body.inbattle #speed { display:flex; }
  #toast { top:52px; left:50%; transform:translateX(-50%); font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:70vw; text-align:center; border-color:var(--gold); }
  #toast.show { opacity:1; }
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(10,6,18,.72); z-index:5; }
  #overlay.show { display:flex; } #overlay .box { text-align:center; } #overlay h2 { margin:0 0 4px; font-size:28px; color:var(--gold); } #overlay .sub { opacity:.85; margin-bottom:14px; font-size:13px; } #overlay .row { display:flex; gap:14px; justify-content:center; } #overlay button { font-size:18px; padding:12px 26px; }
  #debug { display:none; position:fixed; top:44px; right:6px; width:310px; max-height:calc(100vh - 60px); overflow:auto; background:rgba(12,8,20,.94); border:1px solid #6b46a3; border-radius:10px; padding:8px 10px; font-size:11.5px; z-index:4; }
  #debug.open { display:block; } #debug .dsec { margin-top:8px; border-top:1px solid #35244f; padding-top:6px; } #debug label { display:flex; gap:6px; align-items:center; margin:2px 0; } #debug label input { flex:1; } #debug table { border-collapse:collapse; width:100%; } #debug th { font-weight:600; opacity:.7; } #debug input.num { width:44px; background:#1b1230; color:#fff; border:1px solid #4a3470; border-radius:4px; padding:2px; } #debug button { padding:4px 7px; font-size:11px; } #debug select { background:#1b1230; color:#fff; }
  body.gallery #top, body.gallery #enemy, body.gallery #hand, body.gallery #side, body.gallery #info, body.gallery #gear { display:none; }
  #rotate { position:fixed; inset:0; background:#120e1a; display:none; align-items:center; justify-content:center; font-size:20px; z-index:9; }
  @media (orientation:portrait) { #rotate { display:flex; } }
  #loading { position:fixed; inset:0; background:#120e1a; display:flex; align-items:center; justify-content:center; font-size:18px; z-index:8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="panel"><span id="hearts"></span><span id="wave"></span><span id="domwrap">&#128293; <span id="dom"></span><span id="dombar"><span id="domfill" style="display:block"></span></span></span></div>
<div id="enemy" class="panel"></div>
<button id="gear" class="panel" title="Debug panel">&#9881;</button>
<div id="speed" class="panel"><button data-speed="1">1x</button><button data-speed="2">2x</button><button data-speed="4">4x</button></div>
<div id="info" class="panel"></div>
<div id="hand" class="panel"></div>
<div id="side" class="panel"><div id="unitpanel"><button id="btnMerge">Merge</button><button id="btnRemove">Remove</button></div><button id="btnSwap">Swap (1/round)</button><button id="btnBattle">BATTLE</button></div>
<div id="toast" class="panel"></div>
<div id="overlay"></div>
<div id="debug"></div>
<div id="rotate">Rotate your device to landscape &#8635;</div>
<div id="loading">Loading army&hellip;</div>
<script src="vendor/babylon.js"></script>
<script src="vendor/babylonjs.loaders.min.js"></script>
<script src="game.js"></script>
</body>
</html>
