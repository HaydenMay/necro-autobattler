<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Necromancer Merge Autobattler - prototype</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Necro Battler">
<meta name="theme-color" content="#120e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { --bg:#120e1a; --panel:rgba(20,14,30,.88); --edge:#5b3a86; --gold:#e6b94a; --purple:#a45bff;
          --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family:system-ui,Segoe UI,Roboto,sans-serif; color:#f1e9ff; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; touch-action:none; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:6px 10px; box-shadow:0 0 14px rgba(120,60,200,.35); }
  #top { top:calc(var(--sat) + 6px); left:50%; transform:translateX(-50%); display:flex; gap:14px; align-items:center; font-weight:700; font-size:15px; white-space:nowrap; }
  #hearts { font-size:17px; letter-spacing:2px; }
  #domwrap { display:flex; align-items:center; gap:6px; } #dombar { width:78px; height:8px; background:#2a1b40; border-radius:5px; overflow:hidden; } #domfill { height:100%; background:linear-gradient(90deg,#8a3cff,#d99bff); width:0; }
  #enemy { top:calc(var(--sat) + 6px); left:calc(var(--sal) + 6px); font-size:12px; min-width:132px; border-color:#7d3a3a; box-shadow:0 0 14px rgba(200,60,60,.3); }
  .erow { display:flex; gap:6px; align-items:center; margin-top:3px; } .erow .x { color:#ffb0a8; } .erow .st { color:var(--gold); margin-left:auto; } .hint { opacity:.6; font-size:10.5px; margin-top:4px; }
  #gear { top:calc(var(--sat) + 6px); right:calc(var(--sar) + 6px); padding:5px 9px; cursor:pointer; font-size:16px; }
  /* bottom-centre stack: info line above the hand of cards. The build camera keeps the grid ABOVE this stack. */
  #bottom { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--sab) + 6px); display:flex; flex-direction:column; align-items:center; gap:5px; max-width:64vw; pointer-events:none; }
  #bottom > * { pointer-events:auto; }
  #info { position:static; font-size:12px; text-align:center; padding:4px 10px; max-width:100%; }
  #hand { position:static; display:flex; gap:8px; max-width:100%; overflow-x:auto; padding:6px 8px; -webkit-overflow-scrolling:touch; touch-action:pan-x; }
  .card { position:relative; width:74px; min-width:74px; padding:16px 4px 5px; text-align:center; background:linear-gradient(#2b1c44,#1a1029); border:2px solid #6b46a3; border-radius:10px; cursor:pointer; }
  .card.sel { border-color:var(--gold); box-shadow:0 0 12px var(--gold); transform:translateY(-6px); } .card.dis { opacity:.5; } .card.swap { border-color:#39c6a3; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 12px #39c6a3; } }
  .card .cost { position:absolute; top:-8px; left:-8px; width:26px; height:26px; border-radius:50%; background:#8b3cff; border:2px solid #d5b3ff; font-weight:800; font-size:14px; line-height:22px; }
  .card .ic { font-size:28px; line-height:34px; } .card .nm { font-size:11px; font-weight:700; margin-top:2px; } .card .cs { color:var(--gold); font-size:11px; }
  .card.big { width:150px; min-width:150px; padding:22px 8px 10px; } .card.big .ic { font-size:40px; line-height:48px; } .card.big .nm { font-size:14px; } .card.big .role { font-size:11px; opacity:.85; margin-top:6px; }
  .empty { padding:18px; opacity:.6; font-size:13px; }
  #side { right:calc(var(--sar) + 6px); bottom:calc(var(--sab) + 6px); display:flex; flex-direction:column; gap:6px; align-items:stretch; width:150px; }
  button { background:#2b1c44; color:#f1e9ff; border:1px solid #7b55b8; border-radius:9px; padding:8px 10px; font-size:13px; cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.4; cursor:default; } button.on { background:#1d6b58; border-color:#39c6a3; }
  #btnBattle { font-size:19px; font-weight:800; letter-spacing:.06em; padding:12px; background:linear-gradient(#8a2fe0,#5a1aa0); border-color:#d5a8ff; box-shadow:0 0 16px rgba(160,80,255,.7); }
  #unitpanel { display:none; gap:6px; } #unitpanel button { flex:1; }
  #speed { top:calc(var(--sat) + 46px); right:calc(var(--sar) + 6px); display:none; gap:5px; } #speed button.on { background:#3d6ea8; }
  body.inbattle #bottom, body.inbattle #side, body.inbattle #enemy { display:none; }
  body.inbattle #speed { display:flex; }
  #toast { top:calc(var(--sat) + 52px); left:50%; transform:translateX(-50%); font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:70vw; text-align:center; border-color:var(--gold); }
  #toast.show { opacity:1; }
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(10,6,18,.72); z-index:5; }
  #overlay.show { display:flex; } #overlay .box { text-align:center; } #overlay h2 { margin:0 0 4px; font-size:28px; color:var(--gold); } #overlay .sub { opacity:.85; margin-bottom:14px; font-size:13px; } #overlay .row { display:flex; gap:14px; justify-content:center; } #overlay button { font-size:18px; padding:12px 26px; }
  #debug { display:none; position:fixed; top:calc(var(--sat) + 44px); right:calc(var(--sar) + 6px); width:310px; max-width:60vw; max-height:calc(100vh - var(--sat) - var(--sab) - 60px); overflow:auto; touch-action:pan-y; background:rgba(12,8,20,.95); border:1px solid #6b46a3; border-radius:10px; padding:8px 10px; font-size:11.5px; z-index:4; }
  #debug.open { display:block; } #debug .dsec { margin-top:8px; border-top:1px solid #35244f; padding-top:6px; } #debug label { display:flex; gap:6px; align-items:center; margin:2px 0; } #debug label input { flex:1; } #debug table { border-collapse:collapse; width:100%; } #debug th { font-weight:600; opacity:.7; } #debug input.num { width:44px; background:#1b1230; color:#fff; border:1px solid #4a3470; border-radius:4px; padding:2px; } #debug button { padding:4px 7px; font-size:11px; } #debug select { background:#1b1230; color:#fff; }
  body.gallery #top, body.gallery #enemy, body.gallery #bottom, body.gallery #side, body.gallery #gear { display:none; }
  #rotate { position:fixed; inset:0; background:#120e1a; display:none; align-items:center; justify-content:center; font-size:20px; z-index:9; }
  @media (orientation:portrait) { #rotate { display:flex; } }
  #loading { position:fixed; inset:0; background:#120e1a; display:flex; align-items:center; justify-content:center; font-size:18px; z-index:8; }
  /* phones in landscape: everything a little smaller so the whole grid fits above the cards */
  @media (max-height:520px) {
    #top { font-size:13px; gap:10px; padding:4px 9px; } #hearts { font-size:14px; } #dombar { width:60px; }
    #enemy { font-size:10.5px; min-width:104px; padding:4px 7px; } .hint { display:none; }
    #hand { gap:6px; padding:4px 6px; } .card { width:58px; min-width:58px; padding:12px 2px 3px; border-width:1.5px; } .card .cost { width:21px; height:21px; font-size:12px; line-height:17px; top:-7px; left:-7px; }
    .card .ic { font-size:21px; line-height:25px; } .card .nm { font-size:9px; margin-top:1px; } .card .cs { font-size:9px; }
    #info { font-size:10.5px; padding:3px 8px; } #side { width:118px; gap:5px; } button { padding:6px 8px; font-size:12px; } #btnBattle { font-size:15px; padding:9px; }
    #overlay h2 { font-size:22px; } .card.big { width:120px; min-width:120px; } #toast { font-size:11.5px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="panel"><span id="hearts"></span><span id="wave"></span><span id="domwrap">&#128293; <span id="dom"></span><span id="dombar"><span id="domfill" style="display:block"></span></span></span></div>
<div id="enemy" class="panel"></div>
<button id="gear" class="panel" title="Debug panel">&#9881;</button>
<div id="speed" class="panel"><button data-speed="1">1x</button><button data-speed="2">2x</button><button data-speed="4">4x</button><span style="width:6px"></span><button data-cam="close" title="Follow the action up close">Close</button><button data-cam="wide" title="See both whole armies">Wide</button></div>
<div id="bottom"><div id="info" class="panel"></div><div id="hand" class="panel"></div></div>
<div id="side" class="panel"><div id="unitpanel"><button id="btnMerge">Merge</button><button id="btnRemove">Remove</button></div><button id="btnSwap">Swap (1/round)</button><button id="btnBattle">BATTLE</button></div>
<div id="toast" class="panel"></div>
<div id="overlay"></div>
<div id="debug"></div>
<div id="rotate">Rotate your device to landscape &#8635;</div>
<div id="loading">Loading army&hellip;</div>
<script src="vendor/babylon.js"></script>
<script src="vendor/babylonjs.loaders.min.js"></script>
<script src="game.js"></script>
</body>
</html>
