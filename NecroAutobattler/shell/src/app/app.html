@if (!onRun()) { <app-backdrop [calm]="!onHome()" /> }
<nav class="rail" [class.hide]="onRun()">
  <a routerLink="/home" routerLinkActive="active"><img class="ri" src="assets/icons/home.png" alt="">Home@if (save.milestonesReady()) { <i class="rbadge">{{ save.milestonesReady() }}</i> }</a>
  <a routerLink="/souls" routerLinkActive="active"><img class="ri" src="assets/icons/souls.png" alt="">Souls@if (save.readyCount()) { <i class="rbadge ok">{{ save.readyCount() }}</i> }</a>
  <a routerLink="/shop" routerLinkActive="active"><img class="ri" src="assets/icons/shop.png" alt="">Shop@if (save.packs().length) { <i class="rbadge">{{ save.packs().length }}</i> }</a>
  <a routerLink="/settings" routerLinkActive="active"><img class="ri" src="assets/icons/settings.png" alt="">Settings</a>
</nav>

<main class="page" [class.hide]="onRun()"><router-outlet /></main>

<!-- The playable 3D screen, full-screen. Always in the page (so a run is kept while you visit Home or Souls); hidden and paused when not on /run. -->
<div id="battleHost" [class.on]="onRun()">
  <canvas id="c"></canvas>
  <div id="top" class="panel"><span id="hearts"></span><span id="wave"></span><span id="domwrap"><img class="ic" src="assets/icons/dominion.png" alt=""> <span id="dom"></span><span id="dombar"><span id="domfill" style="display:block"></span></span></span></div>
  <button id="btnHome" class="panel" title="Back to Home (your run is kept)"><img src="assets/icons/home.png" alt="Home"></button>
  <div id="enemy" class="panel"></div>
  <button id="gear" class="panel" title="Debug panel"><img src="assets/icons/settings.png" alt="Debug panel"></button>
  <div id="snd" class="panel"><button id="btnMusic" title="Music on/off"><img src="assets/icons/music.png" alt="Music"></button><button id="btnSfx" title="Sound effects on/off"><img src="assets/icons/sound_on.png" alt="Sound effects"></button></div>
  <div id="speed" class="panel"><button id="btnSpeed" title="Battle speed">1x</button><span style="width:6px"></span><button data-cam="close" title="Follow the action up close">Close</button><button data-cam="wide" title="See both whole armies">Wide</button></div>
  <div id="bottom"><div id="info" class="panel"></div><div id="hand" class="panel"></div></div>
  <div id="side" class="panel"><div id="unitpanel"><button id="btnRemove">Remove</button></div><button id="btnSwap">Swap (1/round)</button><button id="btnBattle">BATTLE</button></div>
  <div id="inspectbar"></div>
  <div id="toast" class="panel"></div>
  <div id="overlay"></div>
  <div id="debug"></div>
  <div id="loading">Loading army&hellip;</div>
</div>
<div id="rotate">Rotate your device to landscape &#8635;</div>
<app-tutorial />
